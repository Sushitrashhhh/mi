[package]
name = "mi-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.54", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP client for Gemini REST API
reqwest = { version = "0.13", features = ["json", "stream"] }

# WebSocket server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# OS credential store for API keys
keyring = { version = "4.2", features = ["windows-native-keyring-store"] }

# Structured logging to JSONL
tracing = "0.1"

# IDs and timestamps
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Home directory
dirs = "6"

# SQLite for memory persistence (bundled = ships SQLite, functions = custom SQL functions)
rusqlite = { version = "0.43", features = ["bundled", "functions"] }

# Secret filtering in memory extraction
regex = "1.11"

# CancellationToken for kill switch / turn cancellation
tokio-util = "0.7"

# Voice (Phase 4): audio capture
cpal = "0.18"

# Voice (Phase 4): local STT via whisper.cpp
whisper-rs = "0.16"

# Vision (Phase 5): screen capture + image encoding
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Voice (Phase 4): Windows native TTS via WinRT Speech Synthesis
windows = { version = "0.62", features = [
    "Media_SpeechSynthesis",
    "Media_Core",
    "Foundation",
    "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
