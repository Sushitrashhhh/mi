[package]
name = "mi-bin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mi"
path = "src/main.rs"

[dependencies]
mi-core = { path = "../mi-core" }

# CLI argument parsing
clap = { version = "4.6", features = ["derive"] }

# Async runtime
tokio = { version = "1.54", features = ["full"] }

# Streams (for StreamExt)
futures = "0.3"

# WebSocket server (for serve command)
axum = { version = "0.8", features = ["ws"] }

# IDs
uuid = { version = "1", features = ["v4"] }

# Colored terminal output
colored = "3"

# For reading password input (set-gemini-key)
rpassword = "7"

# Logging
tracing = "0.1"

# JSON serialization (for memory export)
serde_json = "1.0"

# Phase 3: System presence & overlay
eframe = "0.37"            # egui overlay bar
tray-icon = "0.26"         # system tray icon
muda = "0.21"              # tray context menu
global-hotkey = "0.10"     # global hotkeys (Ctrl+Shift+M, etc.)
notify-rust = "4"          # native OS notifications
image = "0.25"             # icon image creation for tray

# Timestamps (for overlay display)
chrono = "0.4"

# Serde (for overlay state serialization)
serde = { version = "1.0", features = ["derive"] }

# CancellationToken
tokio-util = "0.7"

# Home directory (for instance lock PID file)
dirs = "6"

# Phase 4: audio playback for TTS output
rodio = "0.23"

# Phase 5: base64-encode dropped images for the vision model
base64 = "0.22"
