[core]
host = "127.0.0.1"
port = 7777
autonomy = "normal"            # "normal" | "dry_run" | "paused"
max_steps = 12

[models]                       # fill from `mi doctor` output; never hardcode in code
fast = ""
default = ""
deep = ""
vision = ""
live = ""
tts = ""
embed = ""
local = "llama3.2:3b"

[voice]
pipeline = "pipeline"          # "pipeline" (VAD + whisper + TTS) | "live" (future)
stt_model = "tiny"             # whisper model size: "tiny" (~75MB) | "base" (~150MB)
silence_timeout_s = 2.0        # seconds of silence before hands-free auto-stop
vad_threshold = 0.02           # RMS energy threshold for voice activity
barge_in = false               # interrupt TTS playback with new speech
wake_enabled = true            # always-on "hey mi" wake word (listens to mic in background)
wake_word = "hey mi"           # phrase that wakes mi (matched against local whisper)
wake_threshold = 0.6           # match confidence (0.0–1.0) to trigger a wake
tts_backend = "kelados"        # "kelados" (Kokoro voices, needs `npx kelados serve`) | "windows"
tts_voice = "af_heart"         # Kokoro voice id, e.g. af_heart, af_bella, bf_emma (female); am_michael (male)
kelados_url = "http://127.0.0.1:8880"  # local Kelados TTS server; falls back to Windows voice if down

[privacy]
keep_screenshots = false       # keep captured screenshots on disk (default: in-memory only)
redact_screenshots = true      # redact sensitive regions before sending (not yet implemented)
retention_days = 90            # retention window for anything that is persisted
